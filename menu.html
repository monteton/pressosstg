<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a4bd1" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <title>Питание</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="main.html" aria-label="Назад" data-icon="back"></a>
      <h1>Питание</h1>
    </header>

    <p class="sub" style="margin:0 2px 14px">Два меню, которые работают вместе с тренировками на осанку и пресс. Откройте прямо в приложении или скачайте PDF.</p>

    <article class="menu-card">
      <img class="menu-cover" src="images/cover-1300.jpg" alt="Обложка: Меню 1300 калорий">
      <div class="menu-info">
        <span class="menu-tag">84 страницы</span>
        <h2>Меню 1300 калорий</h2>
        <p>Рацион на 1300 калорий в день</p>
        <div class="menu-actions">
          <button class="btn btn-green btn-sm" data-pdf="1300call.pdf">Открыть</button>
          <a class="btn btn-ghost btn-sm" href="1300call.pdf" download>Скачать</a>
        </div>
      </div>
    </article>

    <article class="menu-card">
      <img class="menu-cover" src="images/cover-belly.jpg" alt="Обложка: Меню для плоского живота">
      <div class="menu-info">
        <span class="menu-tag">18 страниц</span>
        <h2>Меню для плоского живота</h2>
        <p>Рацион от нутрициолога</p>
        <div class="menu-actions">
          <button class="btn btn-green btn-sm" data-pdf="menu-ploskiy-zhivot.pdf">Открыть</button>
          <a class="btn btn-ghost btn-sm" href="menu-ploskiy-zhivot.pdf" download>Скачать</a>
        </div>
      </div>
    </article>
  </div>

  <div class="modal pdf-modal" id="pdf-modal">
    <div class="pdf-wrap">
      <button class="modal-close" data-close aria-label="Закрыть" data-icon="close"></button>
      <div class="pdf-pages" id="pdf-pages"></div>
      <div class="pdf-loader" id="pdf-loader"><div class="spinner"></div>Загрузка меню…</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = ICONS[el.dataset.icon]);
    renderTabbar('');

    let PDF_URL = '';
    const modal = document.getElementById('pdf-modal');
    const pages = document.getElementById('pdf-pages');
    const loader = document.getElementById('pdf-loader');
    let pdfDoc = null;
    bindModal(modal);

    // При закрытии освобождаем память
    new MutationObserver(() => {
      if (!modal.classList.contains('open') && pdfDoc) {
        pages.innerHTML = '';
        pdfDoc.destroy();
        pdfDoc = null;
      }
    }).observe(modal, { attributes: true, attributeFilter: ['class'] });

    document.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => openPdf(b.dataset.pdf));

    async function openPdf(url) {
      PDF_URL = url;
      openModal(modal);
      loader.style.display = 'flex';
      loader.innerHTML = '<div class="spinner"></div>Загрузка меню…';
      pages.innerHTML = '';
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        for (let n = 1; n <= pdfDoc.numPages; n++) {
          if (!pdfDoc) return;
          const page = await pdfDoc.getPage(n);
          const base = page.getViewport({ scale: 1 });
          const vp = page.getViewport({ scale: pages.clientWidth / base.width * ratio });
          const canvas = document.createElement('canvas');
          canvas.width = vp.width;
          canvas.height = vp.height;
          pages.appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
          if (n === 1) loader.style.display = 'none';
        }
      } catch (err) {
        console.error(err);
        loader.innerHTML = 'Не удалось открыть меню.<br><a href="' + PDF_URL + '" style="text-decoration:underline">Открыть файл напрямую</a>';
      }
    }
  </script>
</body>
</html>
