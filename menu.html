<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a4bd1" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <title>Меню 1300 калорий</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="main.html" aria-label="Назад" data-icon="back"></a>
      <h1>Питание</h1>
    </header>

    <div class="menu-hero">
      <img src="images/menu.jpg" alt="">
      <div class="mh-text">
        <h2>Меню 1300 калорий</h2>
        <p>Лучшая версия себя</p>
      </div>
    </div>

    <div class="card">
      <p class="sub">Меню на 1300 калорий в день. Используйте его вместе с тренировками на осанку и пресс.</p>
    </div>

    <button class="btn btn-green" id="open-pdf"><span data-icon="file"></span>Открыть меню</button>
    <div style="height:12px"></div>
    <a class="btn btn-ghost" href="1300call.pdf" download>Скачать PDF</a>
  </div>

  <div class="modal pdf-modal" id="pdf-modal">
    <div class="pdf-wrap">
      <button class="modal-close" data-close aria-label="Закрыть" data-icon="close"></button>
      <div class="pdf-pages" id="pdf-pages"></div>
      <div class="pdf-loader" id="pdf-loader"><div class="spinner"></div>Загрузка меню…</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = ICONS[el.dataset.icon]);
    renderTabbar('');

    const PDF_URL = '1300call.pdf';
    const modal = document.getElementById('pdf-modal');
    const pages = document.getElementById('pdf-pages');
    const loader = document.getElementById('pdf-loader');
    let pdfDoc = null;
    bindModal(modal);

    // При закрытии освобождаем память
    new MutationObserver(() => {
      if (!modal.classList.contains('open') && pdfDoc) {
        pages.innerHTML = '';
        pdfDoc.destroy();
        pdfDoc = null;
      }
    }).observe(modal, { attributes: true, attributeFilter: ['class'] });

    document.getElementById('open-pdf').onclick = async () => {
      openModal(modal);
      loader.style.display = 'flex';
      loader.innerHTML = '<div class="spinner"></div>Загрузка меню…';
      pages.innerHTML = '';
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        for (let n = 1; n <= pdfDoc.numPages; n++) {
          if (!pdfDoc) return;
          const page = await pdfDoc.getPage(n);
          const base = page.getViewport({ scale: 1 });
          const vp = page.getViewport({ scale: pages.clientWidth / base.width * ratio });
          const canvas = document.createElement('canvas');
          canvas.width = vp.width;
          canvas.height = vp.height;
          pages.appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
          if (n === 1) loader.style.display = 'none';
        }
      } catch (err) {
        console.error(err);
        loader.innerHTML = 'Не удалось открыть меню.<br><a href="' + PDF_URL + '" style="text-decoration:underline">Открыть файл напрямую</a>';
      }
    };
  </script>
</body>
</html>
