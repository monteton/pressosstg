<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Осанка и пресс</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Осанка и пресс" />
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#3a1f6e" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== Install Banner (Forced Fullscreen) ===== */
    .install-banner {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #3a1f6e 0%, #1d1433 60%, #123a2a 100%);
      color: #fff;
      padding: 2rem 1.5rem;
      z-index: 99999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.5rem;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .install-banner.show {
      display: flex;
    }

    .install-banner-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
      max-width: 400px;
    }

    .install-banner-icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .install-banner-text {
      width: 100%;
    }

    .install-banner-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      line-height: 1.2;
    }

    .install-banner-subtitle {
      font-size: 1rem;
      opacity: 0.85;
      margin: 0;
      line-height: 1.4;
    }

    .install-banner-btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: linear-gradient(120deg, #8f5cf2 0%, #7a4bd1 45%, #3fb07e 100%);
      background-size: 200% auto;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 20px rgba(122, 75, 209, 0.45);
      transition: transform 0.1s ease, background-position 0.3s ease;
    }

    .install-banner-btn:hover {
      background-position: right center;
    }

    .install-banner-btn:active {
      transform: scale(0.96);
    }

    .install-banner-steps {
      font-size: 1rem;
      opacity: 0.9;
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
    }

    .install-banner-steps b {
      color: #9ee6c2;
    }

    .install-url-box {
      width: 100%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 0.7rem 1rem;
      color: #9ee6c2;
      font-size: 0.85rem;
      font-family: monospace;
      text-align: center;
      cursor: pointer;
      user-select: all;
      outline: none;
      box-sizing: border-box;
    }

    /* ===== iOS Safari visual guide ===== */
    .ios-guide {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }

    .ios-steps-list {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 1rem 1.2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
    }

    .ios-step {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .ios-step-num {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #8f5cf2, #3fb07e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .share-icon-inline {
      display: inline-block;
      width: 22px;
      height: 22px;
      vertical-align: middle;
      margin: 0 2px;
      position: relative;
      top: -1px;
    }

    /* Bouncing arrow pointing down */
    .ios-arrow-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 0.5rem;
    }

    .ios-arrow-label {
      font-size: 0.8rem;
      opacity: 0.6;
      letter-spacing: 0.05em;
    }

    .ios-bounce-arrow {
      font-size: 2.5rem;
      animation: ios-bounce 1.4s ease-in-out infinite;
      line-height: 1;
    }

    @keyframes ios-bounce {

      0%,
      100% {
        transform: translateY(0);
        opacity: 1;
      }

      50% {
        transform: translateY(10px);
        opacity: 0.7;
      }
    }

    body {
      margin: 0;
      background: #1d1433;
      color: #fff;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .splash {
      position: relative;
      height: 100vh;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      overflow: hidden;
    }
    .splash-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      animation: ken-burns 20s ease-out infinite;
    }
    @keyframes ken-burns {
      0%, 100% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.1) translate(-2%, 2%); }
    }
    .splash-shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(29, 20, 51, .95) 0%, rgba(58, 31, 110, .55) 45%, rgba(0, 0, 0, 0) 75%),
        linear-gradient(135deg, rgba(122, 75, 209, .25), rgba(63, 176, 126, .15));
    }
    .splash-content {
      position: relative; z-index: 1;
      height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 0 24px calc(56px + var(--safe-bottom));
      text-align: center;
    }
    .splash-tag {
      font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      color: #9ee6c2;
      background: rgba(63, 176, 126, .18);
      border: 1px solid rgba(158, 230, 194, .35);
      padding: 6px 12px; border-radius: 999px;
    }
    .splash h1 { margin: 14px 0 6px; font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -.02em; }
    .splash p { margin: 0 0 32px; font-size: 17px; font-weight: 600; opacity: .85; }
    .start-btn {
      display: block;
      width: 100%; max-width: 320px;
      padding: 18px 24px;
      border-radius: 20px;
      background: linear-gradient(120deg, #8f5cf2 0%, #7a4bd1 45%, #3fb07e 100%);
      color: #fff;
      font-size: 17px; font-weight: 800; letter-spacing: .06em;
      text-decoration: none;
      box-shadow: 0 16px 36px -12px rgba(122, 75, 209, .8);
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe { 50% { transform: scale(1.03); } }
    @media (prefers-reduced-motion: reduce) {
      .splash-bg, .start-btn { animation: none; }
    }
  </style>
</head>

<body>
  <div class="splash">
    <img class="splash-bg" src="images/natali.jpg" alt="">
    <div class="splash-shade"></div>
    <div class="splash-content">
      <span class="splash-tag">Программа Натальи Макаренко</span>
      <h1>ОСАНКА<br>И ПРЕСС</h1>
      <p>Ровная спина и плоский живот</p>
      <a class="start-btn" href="main.html">СТАРТ</a>
    </div>
  </div>

  <!-- Install Banner (Forced) -->
  <div class="install-banner" id="installBanner">
    <div class="install-banner-header">
      <img src="icon-192.png" alt="Icon" class="install-banner-icon">
      <div class="install-banner-text">
        <p class="install-banner-title" id="installTitle">Установите приложение</p>
        <p class="install-banner-subtitle" id="installSubtitle">Для продолжения необходимо установить приложение на ваш телефон</p>
      </div>
    </div>
    <button class="install-banner-btn" id="installBtn">Установить</button>
    <div class="install-banner-steps" id="installSteps"></div>
  </div>

  <script>
    // Сброс позиции скролла
    window.addEventListener('load', () => { window.scrollTo(0, 0); });

    // 1. Регистрация Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }

    // 2. Логика баннера установки
    (function () {
      const banner = document.getElementById('installBanner');
      const btn = document.getElementById('installBtn');
      const stepsEl = document.getElementById('installSteps');
      const titleEl = document.getElementById('installTitle');
      const subtitleEl = document.getElementById('installSubtitle');

      // Если уже установлено как приложение — выходим
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
      // Локальный просмотр (файл / localhost) — без баннера
      if (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;

      // === Определение платформы ===
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(ua);

      // === Определение WebView (Telegram, Instagram, VK, Facebook) ===
      // ВАЖНО: Telegram iOS НЕ добавляет 'Telegram' в UA — выглядит как Safari!
      // Настоящий Safari всегда содержит 'Version/X.X' в UA, WebView — нет
      const isTelegramProxy = typeof window.TelegramWebviewProxy !== 'undefined';
      const isTelegram = /Telegram/i.test(ua) || isTelegramProxy;
      const isInstagram = /Instagram/i.test(ua);
      const isFacebook = /FBAN|FBAV/i.test(ua);
      const isVK = /VKAndroidApp|vk_app/i.test(ua);
      // iOS WebView не имеет 'Version/' в UA — именно так отличаем все встроенные браузеры от настоящего Safari
      const isIOSWebViewByUA = isIOS && /Safari/i.test(ua) && !/Version\//i.test(ua);
      const isWebView = isTelegram || isInstagram || isFacebook || isVK || /\bwv\b/.test(ua) || isIOSWebViewByUA;

      // === Определение браузера ===
      const isChrome = /Chrome/i.test(ua) && !/OPR|Opera|Edge|Edg|Samsung|UCBrowser|YaBrowser/i.test(ua) && !isWebView;
      // Настоящий Safari: есть 'Version/', нет Chrome-движков, не WebView
      const isSafari = /Safari/i.test(ua) && /Version\//i.test(ua) && !/Chrome|CriOS|FxiOS|OPiOS|mercury|UCBrowser|YaBrowser/i.test(ua) && !isWebView;
      const isChromeIOS = /CriOS/i.test(ua);
      const isOpera = /OPR|Opera/i.test(ua);
      const isFirefox = /Firefox|FxiOS/i.test(ua);
      const isSamsung = /SamsungBrowser/i.test(ua);
      const isEdge = /Edg|Edge/i.test(ua);
      const isYandex = /YaBrowser/i.test(ua);
      const isUC = /UCBrowser/i.test(ua);

      let deferredPrompt = null;
      let bannerShown = false;

      // === Перехват события установки для Chrome ===
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showBanner('native');
      });

      // === Для iOS и WebView — показываем баннер СРАЗУ ===
      if (isWebView) {
        showBanner('webview');
      } else if (isIOS && isSafari) {
        showBanner('ios-safari');
      } else if (isIOS && !isSafari) {
        // Chrome iOS, Firefox iOS и другие не-Safari браузеры на iOS
        showBanner('ios-other');
      }

      // === Для Chrome/Android/Desktop — ждём 500мс на beforeinstallprompt ===
      if (!bannerShown) {
        setTimeout(() => {
          if (bannerShown) return;
          if (isAndroid && !deferredPrompt) {
            showBanner('android-other');
          } else if (!isAndroid && !isIOS && !deferredPrompt) {
            if (isChrome) {
              showBanner('desktop-chrome');
            } else {
              showBanner('desktop-other');
            }
          }
        }, 500);
      }

      // === Название текущего браузера ===
      function getBrowserName() {
        if (isTelegram) return 'Telegram';
        if (isInstagram) return 'Instagram';
        if (isFacebook) return 'Facebook';
        if (isVK) return 'ВКонтакте';
        if (isOpera) return 'Opera';
        if (isFirefox) return 'Firefox';
        if (isSamsung) return 'Samsung Internet';
        if (isEdge) return 'Edge';
        if (isYandex) return 'Яндекс Браузер';
        if (isUC) return 'UC Browser';
        return 'этот браузер';
      }

      // === Открыть в Chrome через Android Intent ===
      function openInChrome() {
        const currentUrl = window.location.href;
        const url = new URL(currentUrl);
        const intentUrl = 'intent://' + url.host + url.pathname + url.search + url.hash +
          '#Intent;scheme=https;package=com.android.chrome;end';
        window.location.href = intentUrl;
      }

      // === Открыть в Safari через URL scheme (iOS) ===
      function openInSafari() {
        const currentUrl = window.location.href;
        // x-safari-https:// работает в Telegram, Chrome iOS и других WebView
        const safariUrl = currentUrl
          .replace(/^https:\/\//, 'x-safari-https://')
          .replace(/^http:\/\//, 'x-safari-http://');
        window.location.href = safariUrl;
      }

      // === Показать кнопку копирования ссылки (десктоп) ===
      function showDesktopChromePrompt(titleEl, subtitleEl, btn, stepsEl) {
        const currentUrl = window.location.href;
        titleEl.textContent = 'Откройте сайт в Chrome';
        subtitleEl.textContent = 'Для установки нужен Google Chrome';
        btn.textContent = 'Скопировать ссылку';
        btn.style.display = 'inline-block';
        stepsEl.innerHTML = 'Вставьте ссылку в <b>Google Chrome</b> — появится кнопка <b>«Установить»</b>';
        btn.onclick = () => {
          navigator.clipboard.writeText(currentUrl).then(() => {
            btn.textContent = '✓ Скопировано!';
            setTimeout(() => { btn.textContent = 'Скопировать ссылку'; }, 2500);
          }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = currentUrl;
            ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            btn.textContent = '✓ Скопировано!';
            setTimeout(() => { btn.textContent = 'Скопировать ссылку'; }, 2500);
          });
        };
      }

      // === Показать баннер ===
      function showBanner(mode) {
        if (bannerShown) return;
        bannerShown = true;
        banner.classList.add('show');

        if (mode === 'native') {
          // ✅ Chrome: нативная установка
          titleEl.textContent = 'Установите приложение';
          subtitleEl.textContent = 'Быстрый доступ с экрана "Домой"';
          btn.textContent = 'Установить';
          btn.style.display = 'inline-block';
          stepsEl.innerHTML = '';
          btn.onclick = async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') {
                banner.classList.remove('show');
              }
              deferredPrompt = null;
            }
          };

        } else if (mode === 'ios-safari') {
          // 📱 iOS Safari: обязательная установка — объясняем ЗАЧЕМ и КАК

          btn.style.display = 'none';
          stepsEl.innerHTML = `
              <div class="ios-guide">
                <div class="ios-steps-list">
                  <div class="ios-step">
                    <div class="ios-step-num">1</div>
                    <span>Нажмите
                      <svg class="share-icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v13M7 7l5-5 5 5"/>
                        <path d="M20 16v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4"/>
                      </svg>
                      <b>Поделиться</b> — кнопка внизу экрана</span>
                  </div>
                  <div class="ios-step">
                    <div class="ios-step-num">2</div>
                    <span>Прокрутите список вниз, найдите<br><b>«На экран «Домой»»</b></span>
                  </div>
                  <div class="ios-step">
                    <div class="ios-step-num">3</div>
                    <span>Нажмите <b>«Добавить»</b> — готово! 🎉</span>
                  </div>
                </div>
                <div class="ios-arrow-wrap">
                  <span class="ios-arrow-label">кнопка «Поделиться» внизу</span>
                  <span class="ios-bounce-arrow">↓</span>
                </div>
              </div>`;

        } else if (mode === 'ios-other') {
          // 📱 iOS, не Safari → кнопка "Открыть в Safari" + ссылка на случай если не сработала
          const browserName = getBrowserName();
          const currentUrl = window.location.href;
          titleEl.textContent = 'Требуется Safari';
          subtitleEl.textContent = 'Установка из ' + browserName + ' не работает. Нужен Safari.';
          btn.textContent = '🧭 Открыть в Safari';
          btn.style.display = 'inline-block';
          stepsEl.innerHTML =
            '<p style="margin:0 0 0.8rem;font-size:0.95rem;">Нажмите кнопку — откроется Safari.<br>' +
            'Если не сработало, скопируйте ссылку и откройте её в Safari вручную:</p>' +
            '<input readonly class="install-url-box" value="' + currentUrl + '">';
          btn.onclick = () => { openInSafari(); };

        } else if (mode === 'android-other') {
          // 🤖 Android, не Chrome → перенаправить в Chrome
          const browserName = getBrowserName();
          titleEl.textContent = 'Откройте в Chrome';
          subtitleEl.textContent = browserName + ' не поддерживает установку';
          btn.textContent = 'Открыть в Chrome';
          btn.style.display = 'inline-block';
          stepsEl.innerHTML = 'В Chrome появится кнопка <b>«Установить»</b>';
          btn.onclick = () => { openInChrome(); };

        } else if (mode === 'webview') {
          // 💬 Telegram / Instagram / VK / Facebook
          const browserName = getBrowserName();
          if (isAndroid) {
            titleEl.textContent = 'Откройте в Chrome';
            subtitleEl.textContent = 'Установка из ' + browserName + ' невозможна';
            btn.textContent = 'Открыть в Chrome';
            btn.style.display = 'inline-block';
            stepsEl.innerHTML = 'В Chrome появится кнопка <b>«Установить»</b>';
            btn.onclick = () => { openInChrome(); };
          } else if (isIOS) {
            const currentUrl = window.location.href;
            titleEl.textContent = 'Требуется Safari';
            subtitleEl.textContent = 'Из ' + browserName + ' установить приложение нельзя. Нужен Safari.';
            btn.textContent = '🧭 Открыть в Safari';
            btn.style.display = 'inline-block';
            stepsEl.innerHTML = '<p style="margin-bottom:0.8rem; font-size:0.95rem;">Нажмите кнопку выше.<br>Если она не сработала, скопируйте эту ссылку и откройте её в Safari вручную:</p>' +
              '<input readonly class="install-url-box" value="' + currentUrl + '">';
            btn.onclick = () => { openInSafari(); };
          } else {
            showDesktopChromePrompt(titleEl, subtitleEl, btn, stepsEl);
          }

        } else if (mode === 'desktop-chrome') {
          // ✅ Chrome без промпта (нет HTTPS или критерии PWA не выполнены)
          titleEl.textContent = 'Установите приложение';
          subtitleEl.textContent = 'Нажмите кнопку установки в адресной строке';
          btn.style.display = 'none';
          stepsEl.innerHTML =
            'Найдите иконку <b>⊕</b> или <b>💻</b> в правой части адресной строки Chrome<br>' +
            'и нажмите <b>«Установить»</b>.<br><br>' +
            '<span style="opacity:0.6;font-size:0.85em">Если иконки нет — сайт должен быть открыт по HTTPS-адресу, а не из файла.</span>';

        } else if (mode === 'desktop-other') {
          // 🖥️ Десктоп (Firefox, Edge, Safari и т.д.)
          showDesktopChromePrompt(titleEl, subtitleEl, btn, stepsEl);
        }
      }

      // Крестик закрытия убран — установка принудительная
    })();
  </script>
</body>

</html>
